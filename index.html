<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>롯데백화점몰 메타 소재 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: two-pane workbench — inputs and copy fields on the left, the 3:4 proof and its controls on the right; stacks on phones. */
:root{
  --bg:#f3f3f1; --panel:#ffffff; --line:#dedcd6; --fg:#1d1c1a; --muted:#6d6a63;
  --accent:#8c1d2c; --accent-fg:#ffffff; --ok:#1f7a4d; --warn:#a36200; --field:#fbfbfa;
  --ui:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171716; --panel:#211f1d; --line:#38352f; --fg:#efede8; --muted:#a29e95;
  --accent:#e0586a; --accent-fg:#1a0b0e; --ok:#5cc78f; --warn:#e6a23c; --field:#1a1917; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171716; --panel:#211f1d; --line:#38352f; --fg:#efede8; --muted:#a29e95;
  --accent:#e0586a; --accent-fg:#1a0b0e; --ok:#5cc78f; --warn:#e6a23c; --field:#1a1917; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.step{display:flex;flex-direction:column;gap:8px}
.step-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step-h b{font-size:14px;font-weight:600}
.step-h span{font-size:12px;color:var(--muted)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drop{position:relative;border:1px dashed var(--line);border-radius:8px;min-height:74px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--muted);font-size:12px;cursor:pointer;background:var(--field);overflow:hidden}
.drop:hover{border-color:var(--muted)}
.drop img{max-height:46px;max-width:100%;display:block;margin:0 auto 4px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logos button{display:flex;flex-direction:column;gap:6px;align-items:stretch;border:2px solid var(--line);border-radius:8px;padding:6px;background:var(--field);cursor:pointer;color:var(--fg);font:inherit;font-size:11px;text-align:left}
.logos button[aria-checked=true]{border-color:var(--accent)}
.logos .sw{height:52px;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:6px;background-color:#8a8a86;background-image:linear-gradient(45deg,rgba(255,255,255,.12) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.12) 75%),linear-gradient(45deg,rgba(255,255,255,.12) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.12) 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.logos .sw img{max-height:100%;max-width:100%}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos .thumb{width:58px;height:77px;border-radius:6px;overflow:hidden;border:1px solid var(--line);position:relative}
.photos .thumb img{width:100%;height:100%;object-fit:cover}
.photos .thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px;padding:0;cursor:pointer}
.photos .drop{width:58px;min-height:77px;font-size:20px}
button.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:12px;color:var(--muted);min-height:18px}
.status.err{color:var(--warn)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--fg);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.preview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:16px;align-items:start}
@media (max-width:1100px){.preview{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;max-width:540px;width:100%;margin:0 auto}
#proof{width:100%;max-width:100%;aspect-ratio:3/4;height:auto;display:block;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);background:#ccc}
.guide{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.9);pointer-events:none;mix-blend-mode:difference}
.guide span{position:absolute;right:4px;top:-16px;font-size:10px;color:#fff}
.ctrls{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctrl label{margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:40px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:2px}
.variants{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.variants button{flex:0 0 auto;width:96px;border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;text-align:left;color:var(--fg)}
.variants button[aria-current=true]{border-color:var(--accent)}
.variants canvas{width:100%;display:block;border-radius:6px}
.variants small{display:block;font-size:11px;color:var(--muted);padding:3px 4px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px}
.checks li{display:flex;gap:6px;align-items:flex-start}
.checks i{font-style:normal;font-weight:600;flex:0 0 auto;min-width:30px}
.checks .ok i{color:var(--ok)} .checks .no i{color:var(--warn)}
pre.body{white-space:pre-wrap;margin:0;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.6 var(--ui)}
.dropped{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
#fallbackImg{max-width:100%;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>롯데백화점몰 메타 소재 메이커</h1>
    <p>롯데 로고 선택 · 연출컷 · 광고주 문구 → 3:4 소재 (1080×1440) + 본문</p>
  </header>

  <div class="grid">
    <!-- INPUT -->
    <section class="panel" aria-label="입력">
      <h2>입력</h2>

      <div class="step">
        <div class="step-h"><b>1. 로고</b><span>롯데 로고 선택 · 브랜드 로고 업로드</span></div>
        <div class="logos" id="logoPick" role="radiogroup" aria-label="롯데백화점 로고"></div>
        <div class="drop" id="brandDrop"><input type="file" id="brandFile" accept="image/*" aria-label="브랜드 로고"><div id="brandLbl">브랜드 로고 (PNG 투명 배경)<br>없으면 롯데 단독</div></div>
        <button class="btn" id="brandClear" type="button" hidden style="align-self:flex-start;padding:6px 10px">브랜드 로고 빼기</button>
      </div>

      <div class="step">
        <div class="step-h"><b>2. 연출컷</b><span>최대 4장 · 장마다 다른 카피</span></div>
        <div class="photos" id="photos"></div>
      </div>

      <div class="step">
        <div class="step-h"><b>3. 광고주 문구</b><span>받은 그대로 붙여넣기</span></div>
        <textarea id="raw" rows="7" aria-label="광고주 문구"></textarea>
        <div class="row">
          <button class="btn primary" id="genBtn">카피 정리 + 소재 만들기</button>
          <button class="btn" id="againBtn" hidden>다른 카피</button>
          <button class="btn" id="stopBtn" hidden>중지</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>

      <div class="step" id="editStep">
        <div class="step-h"><b>4. 카피 다듬기</b><span id="variantName" class="tag">소재 1</span></div>
        <div class="fields">
          <div class="full"><label>유형</label>
            <div class="seg" id="typeSeg"><button data-v="A" aria-pressed="true">A 행사명 메인</button><button data-v="B" aria-pressed="false">B 혜택 메인</button></div>
          </div>
          <div class="full"><label for="fSub">서브 카피 (1줄 · 15자 이내)</label><input type="text" id="fSub"></div>
          <div class="full"><label for="fMain">메인 타이틀 (줄바꿈으로 2줄까지 · 줄당 7자 내외)</label><textarea id="fMain" rows="2"></textarea></div>
          <div><label for="fEmph">포인트 컬러 단어 (선택)</label><input type="text" id="fEmph"></div>
          <div><label for="fBen">혜택 라인 (1줄)</label><input type="text" id="fBen"></div>
        </div>
      </div>
    </section>

    <!-- OUTPUT -->
    <section class="panel" aria-label="결과">
      <div class="row" style="justify-content:space-between">
        <h2>결과</h2>
        <div class="row">
          <button class="btn" id="copyBody">본문 복사</button>
          <button class="btn primary" id="saveBtn">PNG 저장</button>
        </div>
      </div>
      <div class="variants" id="variants" aria-label="소재 목록"></div>

      <div class="preview">
        <div class="stage" id="stage">
          <canvas id="proof" width="1080" height="1440" aria-label="소재 미리보기"></canvas>
          <div class="guide" id="g40" style="top:40.28%"><span>y 580 · 텍스트 한계</span></div>
        </div>

        <div class="ctrls">
          <div class="ctrl"><label for="scene">배경 연출 <span id="sceneNote"></span></label>
            <select id="scene" style="width:100%;font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--fg)"></select></div>
          <div class="ctrl" id="sceneCtrls">
            <label for="pscale">제품 크기</label><input type="range" id="pscale" min="50" max="110" value="92">
            <label for="tol" style="margin-top:8px">배경 제거 감도 (흰 테두리가 남으면 올리기)</label><input type="range" id="tol" min="3" max="40" value="12">
          </div>
          <div class="ctrl"><label>카피 가로 위치</label>
            <div class="seg" id="sideSeg"><button data-v="auto" aria-pressed="true">자동</button><button data-v="L" aria-pressed="false">왼쪽</button><button data-v="R" aria-pressed="false">오른쪽</button></div></div>
          <div class="ctrl"><label>카피 세로 위치</label>
            <div class="seg" id="copyYSeg"><button data-v="top" aria-pressed="true">상단</button><button data-v="mid" aria-pressed="false">중앙</button><button data-v="bottom" aria-pressed="false">하단</button></div></div>
          <div class="ctrl"><label>배경 밝기 (텍스트 색)</label>
            <div class="seg" id="toneSeg"><button data-v="auto" aria-pressed="true">자동</button><button data-v="light" aria-pressed="false">밝음</button><button data-v="dark" aria-pressed="false">어두움</button></div></div>
          <div class="ctrl"><label>포인트 컬러 <span id="colorSrc"></span></label>
            <div class="row"><input type="color" id="pColor" aria-label="포인트 컬러"><button class="btn" id="colorAuto" style="padding:6px 10px">이미지에서 다시 뽑기</button></div></div>
          <div class="ctrl"><label>로고 색</label>
            <div class="seg" id="logoSeg"><button data-v="auto" aria-pressed="true">자동</button><button data-v="orig" aria-pressed="false">원본</button><button data-v="black" aria-pressed="false">블랙</button><button data-v="white" aria-pressed="false">화이트</button></div></div>
          <div class="ctrl"><label>로고 가로 위치</label>
            <div class="seg" id="logoXSeg"><button data-v="auto" aria-pressed="true">카피 쪽</button><button data-v="L" aria-pressed="false">왼쪽</button><button data-v="C" aria-pressed="false">가운데</button><button data-v="R" aria-pressed="false">오른쪽</button></div></div>
          <div class="ctrl"><label>로고 세로 위치</label>
            <div class="seg" id="logoYSeg"><button data-v="top" aria-pressed="true">상단</button><button data-v="bottom" aria-pressed="false">하단</button></div></div>
          <div class="ctrl"><label for="fx">사진 · 제품 좌우 위치</label><input type="range" id="fx" min="0" max="100" value="50"></div>
          <div class="ctrl"><label for="fy">사진 · 제품 상하 위치</label><input type="range" id="fy" min="0" max="100" value="50"></div>
          <div class="ctrl"><label for="ov">상단 그라데이션 보정 (최대 40%)</label><input type="range" id="ov" min="0" max="40" value="0"></div>
          <div class="ctrl"><label>가이드 체크</label><ul class="checks" id="checks"></ul></div>
        </div>
      </div>

      <div class="step">
        <div class="step-h"><b>메타 본문</b><span>해시태그 없음</span></div>
        <pre class="body" id="body"></pre>
        <p class="dropped" id="dropped"></p>
      </div>
      <img id="fallbackImg" alt="저장용 소재 이미지 (길게 눌러 저장)" hidden>
    </section>
  </div>
</div>

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const fileToDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

/* ---------- text drawing with fixed tracking ---------- */

/* ---------- resolve a variant into concrete render params ---------- */

  const photo = state.photos[v.photo] || state.photos[0];

  const band = ana[v.copyY||"top"] || ana.top;

/* ---------- copy block geometry ---------- */

  add(charCount(v.sub)<=15 && m.subW<=W-144, `서브 카피 ${charCount(v.sub)}자 (15자 이내, 1줄)`);
  add(m.mainLines.length>=1 && m.mainLines.length<=2, `메인 타이틀 ${m.mainLines.length}줄 (1~2줄)`);
  const longest = Math.max(0,...m.mainLines.map(charCount));
  add(longest<=8, `메인 타이틀 한 줄 최대 ${longest}자 (7자 내외)`);
  add(!!(v.ben||"").trim() && m.benW<=W-144, `혜택 라인 1줄${m.benW>W-144?" (너무 김)":""}`);
  const nums = ((v.ben||"").match(/\d[\d,.]*/g)||[]).length;
  add(v.type==="A" ? nums>=1 && nums<=2 : nums===0, v.type==="A" ? `혜택 숫자 ${nums}개 (1~2개)` : `B유형 혜택 라인 숫자 없음`);
  if ((v.copyY||"top")==="top") add(m.bottom<=SPEC.limitY, `텍스트 하단 y ${Math.round(m.bottom)} (≤ 580)`);
  else add(m.top>=100 && m.bottom<=H-100, `텍스트 y ${Math.round(m.top)}~${Math.round(m.bottom)} (4:5 안전영역 안) · 제품 가림은 직접 확인`);
  const cm = contrast(parseHex(T.main), bg), cp = contrast(parseHex(m.R.pc.color), bg);
  add(cm>=4.5, `메인 글자 대비 ${cm.toFixed(1)} (≥ 4.5${cm<4.5?", 그라데이션 보정 올리기":""})`);
  add(cp>=3, `포인트 컬러 대비 ${cp.toFixed(1)} (≥ 3, 큰 글자)`);
  add(!/[#]|[\u{1F300}-\u{1FAFF}☀-➿]/u.test((v.sub||"")+(v.main||"")+(v.ben||"").replace("▶","")), "이모지·해시태그 없음");
  return list;
}

/* ---------- copy generation ---------- */
function buildPrompt(raw, n){
  return `너는 롯데백화점몰 메타(인스타그램·페이스북) 피드 광고 이미지 위에 올라갈 카피를 정리한다.
아래 [광고주 원문]으로 소재 ${n}개의 카피를 만든다. 소재가 2개 이상이면 소재마다 소구점을 다르게 한다(혜택 소구 → 신상·시즌 소구 → 단독·한정 소구 → 브랜드·상품 소구 순서, 원문에 없는 소구는 건너뜀). 대표 혜택 숫자는 혜택 소구 소재에 반드시 쓴다.

[구조] 서브 카피(1줄, 15자 이내, 수식어·상품·테마) / 메인 타이틀(1~2줄, 줄당 공백 제외 7자 내외, 브랜드명·행사명) / 혜택 라인(1줄).
[유형]
- A (기본. 숫자 혜택이 있으면 A 우선): 메인=브랜드·행사명, 혜택 라인=대표 혜택 숫자. 예) "최대 29% OFF", "단독 최대 10% 할인 + 10% 쿠폰"
- B: 메인=혜택 자체(예 "최대 68%" / "역대급 할인"), emphasis=메인 속 숫자(예 "68%"), 혜택 라인=숫자 없는 CTA·행사명·협업 표기(예 "롯데 단독 LIVE ▶", "나이키 Special Week")
[정답 레퍼런스]
A | 서브 "좋은 원육만 선별하여 선보이는" | 메인 "프리미엄" / "추석 한우 GIFT" | 혜택 "최대 29% OFF"
A | 서브 "네덜란드 명품 휴지통" | 메인 "브라반티아" | 혜택 "단독 최대 10% 할인 + 10% 쿠폰"
A | 서브 "마음을 전하는 한 잔," | 메인 "오설록" / "추석 선물세트" | emphasis "추석" | 혜택 "최대 25% OFF"
B | 서브 "NEW 피테라 세럼" | 메인 "15%" / "즉시 할인" | 혜택 "롯데 단독 LIVE ▶"
B | 서브 "나이키 인기 아이템" | 메인 "최대 68%" / "역대급 할인" | 혜택 "나이키 Special Week"
[절대 규칙]
- 숫자·할인율·브랜드명·상품명은 원문 그대로. 할인율을 더해 새 숫자를 만들지 않는다.
- 원문에 "최대" 또는 "~"가 붙은 할인이면 "최대"를 붙인다.
- 원문에 없는 혜택·수치·표현을 만들지 않는다.
- 혜택 라인 숫자는 최대 2개. 즉시할인+중복쿠폰+카드할인처럼 쌓인 할인, 기간·날짜, 참여·금액 조건, 추천 상품·가격 리스트, 이모지, 해시태그는 이미지 카피에 넣지 않는다(티켓 오픈처럼 날짜 자체가 행동 포인트면 혜택 라인에 허용).
- emphasis는 메인 타이틀 안에 실제로 있는 단어 1개 또는 빈 문자열.
[본문] body: 3~5줄. 첫 줄=메인 메시지 요약, 다음 줄들=이미지에서 뺀 부가 혜택·기간·조건, 마지막 줄="롯데백화점몰에서 만나보세요." 해시태그 금지, 이모지 최대 2개.
dropped: 이미지 카피에서 뺀 정보를 짧은 명사구 배열로.

[광고주 원문]
${raw}

JSON 하나만 답한다:
{"variants":[{"angle":"혜택 소구","type":"A","sub":"...","main":["...","..."],"emphasis":"","benefit":"..."}],"body":"줄1\\n줄2\\n줄3","dropped":["..."]}`;
}
function fallbackCopy(raw){
  const clean = raw.replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,"").replace(/[▶■●★☆⭐]/g,"");
  const lines = clean.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  let best=null; const re=/(최대|~)?\s*(\d{1,3})\s?%/g; let m;
  while((m=re.exec(clean))){ const n=+m[2]; if(!best||n>best.n) best={n,max:!!m[1]}; }
  const ben = best ? `${best.max?"최대 ":""}${best.n}% 할인` : "롯데백화점몰 단독";
  const head = (lines[0]||"").replace(/\d{1,3}\s?%.*$/,"").trim();
  const words = head.split(/\s+/); let l1="", l2="";
  words.map(w=>w.replace(/[!！?]+$/,"")).filter(Boolean).forEach(w=>{ if (charCount(l1+w)<=7 && !l2) l1=(l1?l1+" ":"")+w; else if (charCount(l2+w)<=9) l2=(l2?l2+" ":"")+w; });
  return { type:"A", sub:"", main:[l1,l2].filter(Boolean).join("\n"), emph:"", ben, angle:"자동 추출" };
}
function setStatus(t, err){ $("status").textContent=t; $("status").className="status"+(err?" err":""); }
const ERR = { not_granted:"Claude 사용이 허용되지 않아 규칙 기반으로 정리했어요. 필드를 직접 다듬어 주세요.", sampling_disabled:"이 계정에서는 Claude를 쓸 수 없어 규칙 기반으로 정리했어요.", rate_limited:"요청이 많아요. 잠시 후 다시 눌러 주세요.", invalid_json:"카피 형식을 읽지 못했어요. 한 번 더 눌러 주세요.", refused:"이 문구로는 카피를 만들 수 없었어요. 문구를 확인해 주세요." };

async function generate(fresh){
  const raw = $("raw").value.trim(); if (!raw){ setStatus("광고주 문구를 먼저 붙여넣어 주세요.", true); return; }
  const n = Math.max(1, state.photos.filter(p=>!p.sample).length || 1);
  const keepView = state.variants.map(v=>({side:v.side,tone:v.tone,logo:v.logo,logoX:v.logoX,logoY:v.logoY,scene:v.scene,pscale:v.pscale,tol:v.tol,copyY:v.copyY,color:v.color,fx:v.fx,fy:v.fy,overlay:v.overlay}));
  const apply = (list, body, dropped) => {
    state.variants = list.slice(0,n).map((c,k)=>({ ...blankVariant(), ...(keepView[k]||{}), ...c, photo:k }));
    while (state.variants.length<n) state.variants.push({ ...state.variants[0], angle:"", photo:state.variants.length });
    state.body = body||""; state.dropped = dropped||[]; state.sel=0; buildVariantStrip(); fillFields(); draw(); renderBody();
  };
  if (!state.sample){ const f=fallbackCopy(raw); apply([f], raw.split("\n").filter(Boolean).slice(0,4).join("\n"), []); setStatus("Claude 연결 없이 규칙 기반으로 정리했어요. 필드를 직접 다듬어 주세요."); return; }
  state.ctl = new AbortController(); $("genBtn").disabled=true; $("againBtn").disabled=true; $("stopBtn").hidden=false;
  setStatus("카피 정리 중… (보통 10~40초)");
  try{
    const res = await state.sample.json(buildPrompt(raw,n), { signal:state.ctl.signal, ...(fresh?{cache:false}:{}) });
    const vs = (res && Array.isArray(res.variants) ? res.variants : []).map(x=>({
      type: x.type==="B"?"B":"A", sub:String(x.sub||""), main:(Array.isArray(x.main)?x.main:[x.main]).filter(Boolean).map(String).slice(0,2).join("\n"),
      emph:String(x.emphasis||""), ben:String(x.benefit||""), angle:String(x.angle||"") }));
    if (!vs.length) throw { code:"invalid_json" };
    apply(vs, String(res.body||""), Array.isArray(res.dropped)?res.dropped.map(String):[]);
    setStatus(`카피 ${vs.length}안 완성. 필드를 고치면 바로 반영돼요.`); $("againBtn").hidden=false;
  }catch(e){
    if (e && e.code==="cancelled"){ setStatus("중지했어요."); }
    else if (e && (e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="capability_disabled"||e.code==="not_declared")){ state.sample=null; const f=fallbackCopy(raw); apply([f],"",[]); setStatus(ERR[e.code]||ERR.not_granted, true); }
    else setStatus(ERR[e&&e.code] || "연결이 잠시 끊겼어요. 다시 눌러 주세요.", true);
  }finally{ $("genBtn").disabled=false; $("againBtn").disabled=false; $("stopBtn").hidden=true; }
}
$("genBtn").onclick = ()=>generate(false);
$("againBtn").onclick = ()=>generate(true);
$("stopBtn").onclick = ()=>state.ctl && state.ctl.abort();

    catch(e){ if (e && e.code==="declined"){ setStatus("저장을 취소했어요."); return; } }
  }
  if (!window.claude){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); setStatus("저장했어요: "+name); return; }
  const img=$("fallbackImg"); img.src=c.toDataURL("image/png"); img.hidden=false; setStatus("아래 이미지를 길게 누르거나 우클릭해서 저장해 주세요.");
};
$("copyBody").onclick = async ()=>{
  const t = $("body").textContent;
  try{ await navigator.clipboard.writeText(t); setStatus("본문을 복사했어요."); }
  catch(e){ const r=document.createRange(); r.selectNodeContents($("body")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); setStatus("본문을 선택했어요. 복사해 주세요."); }
};

/* ---------- sample (opens in a working state) ---------- */
async function sampleImage(){
  const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#d7dac8"); g.addColorStop(1,"#b9bfa4"); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="#e3e2d9"; x.fillRect(0,1110,W,330);
  x.fillStyle="#1d7a68"; x.fillRect(190,790,520,500); x.strokeStyle="#3d3f44"; x.lineWidth=12; x.beginPath(); x.moveTo(330,790); x.bezierCurveTo(330,610,560,610,560,790); x.stroke();
  x.fillStyle="#8ea3e3"; x.beginPath(); const cx=630, cy=1110, r=210; for(let k=0;k<6;k++){ const a=Math.PI/3*k; x.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a)); } x.closePath(); x.fill();
  x.fillStyle="rgba(190,230,215,.85)"; x.beginPath(); x.arc(900,990,140,0,Math.PI*2); x.fill();
  x.fillStyle="rgba(0,0,0,.35)"; x.font=`500 26px ${FONT}`; x.fillText("예시 이미지", 40, H-40);
  return loadImg(c.toDataURL("image/png"));
}
async function loadSample(){
  const img = await sampleImage(); state.photos=[{ id:++pid, img, sample:true }];
  state.variants=[{ ...blankVariant(), sub:"마음을 전하는 한 잔,", main:"오설록\n추석 선물세트", emph:"추석", ben:"최대 25% OFF", angle:"예시" }];

  state.dropped=["이모지"];
  state.sel=0; photoStrip(); buildVariantStrip(); fillFields(); draw(); renderBody();
}
